name: SENSES live smoke tests
on:
  workflow_dispatch:
  deployment_status:
permissions:
  contents: read
concurrency:
  group: senses-live-smoke
  cancel-in-progress: false
jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      E2E_BASE_URL: https://senses-gules.vercel.app
      E2E_LIVE_AUTH: ${{ vars.E2E_LIVE_AUTH }}
      E2E_LIVE_EMAIL: ${{ secrets.E2E_LIVE_EMAIL }}
      E2E_LIVE_PASSWORD: ${{ secrets.E2E_LIVE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-smoke-report
          path: |
            frontend/e2e-artifacts/live-report
            frontend/e2e-artifacts/live-results.json
          retention-days: 7
